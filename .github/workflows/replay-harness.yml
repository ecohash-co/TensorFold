name: Replay harness

on:
  pull_request:
    paths:
      - 'tools/replay/**'
      - '.github/workflows/replay-harness.yml'

permissions:
  contents: read

jobs:
  replay-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - name: A missing or errored record fails the comparison gate
        run: python -m unittest discover -s tools/replay -p replay_run_test.py
